<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="1630" viewBox="0 0 1860 1630"><style>text{font-family:Arial,sans-serif;fill:#1f2937}.title{font-size:36px;font-weight:700}.head{font-size:25px;font-weight:700;fill:white}.name{font-size:25px;font-weight:700}.line{font-size:19px}.small{font-size:20px;fill:#4b5563}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="36" y="54" class="title">MediFlow database · 18 entity tables · 2026-10-11</text><text x="36" y="88" class="small">MariaDB · FK relations listed inside cards · snapshot IDs deliberately have no physical FK</text><rect x="30" y="120" width="590" height="1400" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="30" y="120" width="590" height="52" rx="10" fill="#0369a1"/><text x="48" y="155" class="head">Core / Assignment</text><rect x="44" y="190" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="60" y="222" class="name">department</text><text x="60" y="250" class="line">PK department_id</text><text x="60" y="275" class="line">name · code · bed_count · type</text><rect x="44" y="378" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="60" y="410" class="name">users</text><text x="60" y="438" class="line">PK user_id</text><text x="60" y="463" class="line">FK department_id → department</text><text x="60" y="488" class="line">email · role · provider · account status</text><rect x="44" y="566" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="60" y="598" class="name">patient</text><text x="60" y="626" class="line">PK patient_id</text><text x="60" y="651" class="line">FK department_id → department</text><text x="60" y="676" class="line">chart_number · diagnosis · room · risk flags</text><rect x="44" y="754" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="60" y="786" class="name">shift</text><text x="60" y="814" class="line">PK shift_id</text><text x="60" y="839" class="line">date · type · start_time · end_time</text><rect x="44" y="942" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="60" y="974" class="name">assignment</text><text x="60" y="1002" class="line">PK assignment_id</text><text x="60" y="1027" class="line">FK nurse_id → users · patient_id → patient</text><text x="60" y="1052" class="line">FK shift_id → shift · assigned_date</text><rect x="44" y="1130" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="60" y="1162" class="name">onboarding</text><text x="60" y="1190" class="line">PK onboarding_id</text><text x="60" y="1215" class="line">FK nurse_id → users</text><text x="60" y="1240" class="line">step · is_completed · completed_at</text><rect x="640" y="120" width="590" height="1400" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="640" y="120" width="590" height="52" rx="10" fill="#047857"/><text x="658" y="155" class="head">Clinical Records</text><rect x="654" y="190" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="670" y="222" class="name">vital_sign</text><text x="670" y="250" class="line">PK vital_sign_id</text><text x="670" y="275" class="line">FK patient_id → patient · nurse_id → users</text><text x="670" y="300" class="line">BP · HR · BT · SpO2 · measured_at</text><rect x="654" y="378" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="670" y="410" class="name">nursing_note</text><text x="670" y="438" class="line">PK nursing_note_id</text><text x="670" y="463" class="line">FK patient_id → patient · nurse_id → users</text><text x="670" y="488" class="line">content · plain_text · category · is_important</text><rect x="654" y="566" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="670" y="598" class="name">medical_orders</text><text x="670" y="626" class="line">PK id</text><text x="670" y="651" class="line">FK patient_id → patient</text><text x="670" y="676" class="line">order details · status · ordered_at</text><rect x="654" y="754" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="670" y="786" class="name">medication</text><text x="670" y="814" class="line">PK medication_id</text><text x="670" y="839" class="line">FK patient_id → patient · nurse_id → users</text><text x="670" y="864" class="line">FK medical_order_id → medical_orders</text><rect x="654" y="942" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="670" y="974" class="name">intake_output</text><text x="670" y="1002" class="line">PK intake_output_id</text><text x="670" y="1027" class="line">FK patient_id → patient · nurse_id → users</text><text x="670" y="1052" class="line">intake · output · recorded_at</text><rect x="654" y="1130" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="670" y="1162" class="name">test_results</text><text x="670" y="1190" class="line">PK test_result_id</text><text x="670" y="1215" class="line">FK patient_id → patient · nurse_id → users</text><text x="670" y="1240" class="line">test details · reference · result</text><rect x="654" y="1318" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="670" y="1350" class="name">medical_image</text><text x="670" y="1378" class="line">PK medical_image_id</text><text x="670" y="1403" class="line">FK patient_id → patient</text><text x="670" y="1428" class="line">image_type · image_url · exam_date</text><rect x="1250" y="120" width="590" height="1400" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="1250" y="120" width="590" height="52" rx="10" fill="#7c3aed"/><text x="1268" y="155" class="head">Handover / Supporting</text><rect x="1264" y="190" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="1280" y="222" class="name">handover</text><text x="1280" y="250" class="line">PK handover_id</text><text x="1280" y="275" class="line">FK department_id · from_shift_id · to_shift_id</text><text x="1280" y="300" class="line">FK created_by → users · version</text><text x="1280" y="325" class="line">source_type · status DRAFT/APPROVED</text><text x="1280" y="350" class="line">ai_summary · final_summary · ai_model · approved_at</text><rect x="1264" y="378" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="1280" y="410" class="name">handover_revision</text><text x="1280" y="438" class="line">PK revision_id · index (handover_id, revision_id)</text><text x="1280" y="463" class="line">handover_id / edited_by_id: snapshot IDs (no FK)</text><text x="1280" y="488" class="line">record_version · status · source_type · recorded_at</text><text x="1280" y="513" class="line">ai_summary · final_summary · edited_by_name</text><rect x="1264" y="566" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="1280" y="598" class="name">clinical_audit_log</text><text x="1280" y="626" class="line">PK audit_log_id</text><text x="1280" y="651" class="line">user_id / patient_id: audit IDs (no FK)</text><text x="1280" y="676" class="line">action · resource_type · resource_id · occurred_at</text><rect x="1264" y="754" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="1280" y="786" class="name">chat_history</text><text x="1280" y="814" class="line">PK chat_history_id</text><text x="1280" y="839" class="line">FK nurse_id → users</text><text x="1280" y="864" class="line">message · response · created_at</text><rect x="1264" y="942" width="562" height="174" rx="8" fill="#f8fafc" stroke="#dbe4ee"/><text x="1280" y="974" class="name">email_verification</text><text x="1280" y="1002" class="line">PK verification_id</text><text x="1280" y="1027" class="line">FK user_id → users</text><text x="1280" y="1052" class="line">email · verification_code · expiry_date</text><text x="1280" y="1077" class="line">is_verified · failed_attempts (max 5)</text><text x="36" y="1560" class="small">BaseTimeEntity tables also contain version (@Version), created_at and updated_at.</text><text x="36" y="1593" class="small">Flyway adds flyway_schema_history in migrated environments; it is infrastructure metadata, not an entity table.</text></svg>