name: Verify private mail staging
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Check all staging versions without reading credentials
        shell: bash
        env:
          DEPLOY_BUCKET: ${{ vars.S3_DEPLOY_BUCKET }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          result = subprocess.run([
              'aws', 's3api', 'list-object-versions',
              '--bucket', os.environ['DEPLOY_BUCKET'],
              '--prefix', 'backend/releases/private-mail-',
              '--output', 'json',
          ], capture_output=True, text=True)
          if result.returncode:
              raise SystemExit('Unable to verify staging: check AWS credentials and s3:ListBucketVersions permission. No objects were changed.')
          data = json.loads(result.stdout)
          versions = len(data.get('Versions', []))
          markers = len(data.get('DeleteMarkers', []))
          print(json.dumps({'versions': versions, 'deleteMarkers': markers}))
          if versions or markers:
              raise SystemExit('Staging versions or delete markers remain; administrator review required. No objects were changed.')
          print('Verified: no staging versions or delete markers remain.')
          PY
