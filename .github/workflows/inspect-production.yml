name: Inspect production
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Inspect migration prerequisites
        shell: bash
        run: |
          command=$(cat <<'COMMAND'
          sudo python3 - <<'PYCODE'
          import subprocess, socket, re
          from pathlib import Path
          data = Path('/etc/mediflow/mediflow.env').read_text()
          for key in ('MAIL_USERNAME', 'MAIL_PASSWORD'):
              match = re.search(r'^' + key + r'=(.*)$', data, re.M)
              print(key + ': ' + ('configured' if match and match.group(1).strip().strip('\"\'') else 'missing'))
          logs = subprocess.check_output(['journalctl', '-u', 'mediflow', '--since', '24 hours ago', '--no-pager'], text=True)
          for name in ('MailAuthenticationException', 'AuthenticationFailedException', 'MailSendException', 'SocketTimeoutException', 'ConnectException', 'DataIntegrityViolationException', 'SQLSyntaxErrorException'):
              print(name + ': ' + str(logs.count(name)))
          for code in ('535', '534', '550', '553', '554'):
              print('SMTP status ' + code + ': ' + str(len(re.findall(r'\b' + code + r'\b', logs))))
          try:
              with socket.create_connection(('smtp.naver.com', 465), timeout=8): print('SMTP TCP connection: reachable')
          except OSError as error: print('SMTP TCP connection: ' + type(error).__name__)
          print('Service: ' + subprocess.check_output(['systemctl','is-active','mediflow'], text=True).strip())
          PYCODE
          COMMAND
          )
          jq -n --arg command "$command" '{commands: [$command]}' > "$RUNNER_TEMP/parameters.json"
          command_id=$(aws ssm send-command --instance-ids '${{ vars.EC2_INSTANCE_ID }}' --document-name AWS-RunShellScript --parameters "file://$RUNNER_TEMP/parameters.json" --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id '${{ vars.EC2_INSTANCE_ID }}'
          aws ssm get-command-invocation --command-id "$command_id" --instance-id '${{ vars.EC2_INSTANCE_ID }}' --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
