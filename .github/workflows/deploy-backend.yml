name: Deploy backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'deploy/ec2/**'

concurrency:
  group: production-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon test bootJar
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload release artifact
        id: artifact
        shell: bash
        run: |
          RELEASE_KEY="backend/releases/${GITHUB_SHA}.jar"
          JAR_PATH="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$JAR_PATH"
          aws s3 cp "$JAR_PATH" "s3://${{ vars.S3_DEPLOY_BUCKET }}/${RELEASE_KEY}"
          aws s3 cp ../deploy/ec2/deploy.sh "s3://${{ vars.S3_DEPLOY_BUCKET }}/backend/releases/${GITHUB_SHA}-deploy.sh"
          aws s3 cp ../deploy/ec2/database-backup.py "s3://${{ vars.S3_DEPLOY_BUCKET }}/backend/releases/${GITHUB_SHA}-database-backup.py"
          echo "release_key=${RELEASE_KEY}" >> "$GITHUB_OUTPUT"
      - name: Deploy through SSM
        id: ssm
        working-directory: .
        shell: bash
        run: |
          jq -n --arg command "sudo aws s3 cp 's3://${{ vars.S3_DEPLOY_BUCKET }}/backend/releases/${GITHUB_SHA}-deploy.sh' /opt/mediflow/bin/deploy.sh && sudo aws s3 cp 's3://${{ vars.S3_DEPLOY_BUCKET }}/backend/releases/${GITHUB_SHA}-database-backup.py' /opt/mediflow/bin/database-backup.py && sudo chmod 750 /opt/mediflow/bin/deploy.sh /opt/mediflow/bin/database-backup.py && sudo /opt/mediflow/bin/deploy.sh 's3://${{ vars.S3_DEPLOY_BUCKET }}/${{ steps.artifact.outputs.release_key }}' '${{ vars.FLYWAY_BASELINE_ON_MIGRATE || 'false' }}'" \
            '{commands: [$command]}' > "$RUNNER_TEMP/mediflow-ssm-parameters.json"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "MediFlow ${GITHUB_SHA}" \
            --parameters "file://$RUNNER_TEMP/mediflow-ssm-parameters.json" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}"
      - name: Show deployment result
        if: always() && steps.ssm.outputs.command_id != ''
        working-directory: .
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
