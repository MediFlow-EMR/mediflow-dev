name: Update mail credentials
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-backend
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Stage private credential and update service
        shell: bash
        env:
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          DEPLOY_BUCKET: ${{ vars.S3_DEPLOY_BUCKET }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, tempfile, uuid
          def aws(*args):
              result = subprocess.run(['aws', *args], capture_output=True, text=True)
              if result.returncode: raise RuntimeError('AWS operation failed: ' + args[0] + ' ' + args[1])
              return json.loads(result.stdout) if result.stdout.strip() else {}
          password = os.environ['MAIL_PASSWORD']
          if not password or '\n' in password or '\r' in password: raise RuntimeError('Valid MAIL_PASSWORD secret required')
          bucket = os.environ['DEPLOY_BUCKET']
          key = 'backend/releases/private-mail-' + str(uuid.uuid4()) + '.json'
          version = None
          staged = False
          with tempfile.TemporaryDirectory() as directory:
              path = directory + '/credential.json'
              with open(path, 'w') as file: json.dump({'MAIL_PASSWORD': password}, file)
              os.chmod(path, 0o600)
              try:
                  probe_path = directory + '/empty'
                  open(probe_path, 'w').close()
                  probe_key = key + '.cleanup-probe'
                  probe = aws('s3api','put-object','--bucket',bucket,'--key',probe_key,'--body',probe_path,'--server-side-encryption','AES256')
                  probe_args = ['s3api','delete-object','--bucket',bucket,'--key',probe_key]
                  if probe.get('VersionId'): probe_args += ['--version-id',probe['VersionId']]
                  aws(*probe_args)
                  uploaded = aws('s3api','put-object','--bucket',bucket,'--key',key,'--body',path,'--server-side-encryption','AES256')
                  version = uploaded.get('VersionId')
                  staged = True
                  command = r'''sudo python3 - <<'SERVER'
          import json, subprocess, tempfile, os, re
          from pathlib import Path
          bucket = BUCKET
          key = KEY
          version = VERSION
          with tempfile.TemporaryDirectory() as directory:
              path = directory + '/credential.json'
              args = ['aws','s3api','get-object','--bucket',bucket,'--key',key]
              if version: args += ['--version-id',version]
              args.append(path)
              subprocess.run(args,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              password = json.loads(Path(path).read_text())['MAIL_PASSWORD']
              env = Path('/etc/mediflow/mediflow.env')
              text = env.read_text()
              quoted = '"' + password.replace('\\','\\\\').replace('"','\\"') + '"'
              text, count = re.subn(r'^MAIL_PASSWORD=.*$', lambda _: 'MAIL_PASSWORD=' + quoted, text, flags=re.M)
              if count != 1: raise RuntimeError('Expected one existing MAIL_PASSWORD entry')
              fd, replacement = tempfile.mkstemp(dir=str(env.parent))
              try:
                  with os.fdopen(fd,'w') as file: file.write(text)
                  stat = env.stat()
                  os.chmod(replacement,stat.st_mode & 0o777)
                  os.chown(replacement,stat.st_uid,stat.st_gid)
                  os.replace(replacement,env)
              finally:
                  if os.path.exists(replacement): os.unlink(replacement)
          subprocess.run(['systemctl','restart','mediflow'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          print('Mail credential updated; service restarted')
          SERVER'''.replace('BUCKET',repr(bucket)).replace('KEY',repr(key)).replace('VERSION',repr(version))
                  sent = aws('ssm','send-command','--instance-ids',os.environ['INSTANCE_ID'],'--document-name','AWS-RunShellScript','--parameters',json.dumps({'commands':[command]}))
                  command_id = sent['Command']['CommandId']
                  subprocess.run(['aws','ssm','wait','command-executed','--command-id',command_id,'--instance-id',os.environ['INSTANCE_ID']],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  result = aws('ssm','get-command-invocation','--command-id',command_id,'--instance-id',os.environ['INSTANCE_ID'])
                  if result['Status'] != 'Success': raise RuntimeError('Mail update failed')
                  print('Mail credential updated; no credential included in SSM command or logs')
              finally:
                  if staged:
                      args = ['s3api','delete-object','--bucket',bucket,'--key',key]
                      if version: args += ['--version-id',version]
                      aws(*args)
                      print('Private staging object removed')
          PY
