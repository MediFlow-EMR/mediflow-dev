spring:
  config:
    activate:
      on-profile: prod

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 20261010
    validate-on-migrate: true
    clean-disabled: true

  datasource:
    # EC2 .env 파일의 변수 사용
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&sslMode=${DB_SSL_MODE:verify-full}&serverSslCert=${DB_SSL_CERT:/etc/pki/tls/certs/rds-global-bundle.pem}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 중요: 운영 환경에서는 절대 create를 쓰면 안 됨! (데이터 삭제 방지)
      # validate: 엔티티와 테이블이 맞는지 검사만 함.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false # 운영 로그 깔끔하게 유지
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MariaDBDialect
        jdbc:
          time_zone: Asia/Seoul

  # 이메일 설정 (기존 유지, 변수 처리)
  mail:
    host: smtp.naver.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  # 시큐리티 & OAuth2 (주소 변수화 핵심!)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [profile, email]
            # EC2 .env에 있는 배포용 리다이렉트 주소 사용
            redirect-uri: ${GOOGLE_REDIRECT_URI}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: [profile_nickname, profile_image]
            # EC2 .env에 있는 배포용 리다이렉트 주소 사용
            redirect-uri: ${KAKAO_REDIRECT_URI}
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${SERVER_PORT:9005}

# 로그 레벨 조정 (운영 환경 최적화)
logging:
  level:
    root: INFO
    com.mediflow.emr: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

# 쿠키 & 리다이렉트 설정 (HTTPS/도메인 적용)
cookie:
  domain: ${COOKIE_DOMAIN:.mediflow-emr.cloud}
  secure: ${COOKIE_SECURE:true}
  http-only: true
  same-site: None            # 소셜 로그인 흐름 끊김 방지
  access-token-name: ACCESS_TOKEN
  refresh-token-name: REFRESH_TOKEN
  access-max-age: 900
  refresh-max-age: 604800

app:
  oauth2-success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:https://www.mediflow-emr.cloud/app}
  oauth2-failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL:https://www.mediflow-emr.cloud/auth/signin?from=oauth2}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://mediflow-emr.cloud,https://www.mediflow-emr.cloud}

# 식약처 API
drug-api:
  base-url: https://apis.data.go.kr/1471000/DrbEasyDrugInfoService
  service-key: ${DRUG_API_SERVICE_KEY}

drug-permit-api:
  base-url: https://apis.data.go.kr/1471000/DrugPrdtPrmsnInfoService08

drug-cache:
  enabled: ${DRUG_CACHE_ENABLED:false}
  bucket: ${DRUG_CACHE_BUCKET:}
  region: ${DRUG_CACHE_REGION:ap-northeast-2}
  max-age-hours: ${DRUG_CACHE_MAX_AGE_HOURS:48}

# Gemini API
gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: https://generativelanguage.googleapis.com/v1beta
